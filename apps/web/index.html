<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#0b1220" />
    <!-- Set the theme before first paint so a dark-default visit never flashes
         the light clay page. Mirrors readTheme() in app.jsx. -->
    <script>
      try {
        var t = localStorage.getItem('bih:theme')
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <!-- Nunito — warm, rounded clay typeface (impeccable clay system, choice 1) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>Bicol In-Heat — Be A Trend Detective!</title>
  </head>
  <body class="bg-heat-bg">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
