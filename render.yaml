services:
  - type: web
    name: bicol-in-heat-api
    env: python
    region: singapore
    plan: free
    rootDir: apps/api
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # numpy/scipy/shap/pyproj pins require >=3.12; 3.10 fails the install.
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      # qa.py reads SUPABASE_SERVICE_KEY (not SUPABASE_KEY).
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
